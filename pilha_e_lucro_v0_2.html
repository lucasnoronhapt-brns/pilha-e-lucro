<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pilha &amp; Lucro — v0.2</title>
<style>
:root{
  --tinta:#2B1B0E; --creme:#F5E9D0; --ketchup:#D8352A; --mostarda:#F2B32A;
  --quadro:#2E4638; --painel:rgba(30,17,10,.92); --painel2:rgba(30,17,10,.78);
  --ok:#7AC943;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:ui-monospace,"Cascadia Mono","Courier New",monospace;
  background:#17100b; color:var(--creme);
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
img{image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:none}

/* ---------- HUD ---------- */
#hud{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--painel);border-bottom:3px solid var(--tinta);z-index:5;
}
#hud .box{display:flex;flex-direction:column;line-height:1.15}
#hud .lbl{font-size:9px;letter-spacing:1px;opacity:.65;text-transform:uppercase}
#hud .val{font-size:15px;font-weight:700}
#hud .val.money{color:var(--mostarda)}
#alvowrap{flex:1;min-width:90px}
#alvobar{height:14px;background:#1a0f09;border:2px solid var(--tinta);border-radius:7px;overflow:hidden;margin-top:2px}
#alvofill{height:100%;width:0%;background:linear-gradient(180deg,#e8543f,var(--ketchup));transition:width .5s cubic-bezier(.2,.8,.3,1.2)}
#bossband{
  display:none;background:var(--ketchup);color:#fff;text-align:center;
  font-size:11px;font-weight:700;padding:4px 8px;letter-spacing:.5px;border-bottom:3px solid var(--tinta);
}

/* ---------- Crew ---------- */
#crew{display:flex;gap:6px;padding:6px 10px;background:var(--painel2);overflow-x:auto;scrollbar-width:none;z-index:4}
#crew::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:10px;font-weight:700;padding:5px 9px;border-radius:6px;
  border:2px solid var(--tinta);background:var(--creme);color:var(--tinta);white-space:nowrap;
}
.chip.receita{background:#e9d9b0}
.chip.staff{background:#b9c4cc}
.chip.vazio{opacity:.35;border-style:dashed;background:transparent;color:var(--creme)}
.chip .mini{display:block;font-weight:400;font-size:8.5px;opacity:.75}

/* ---------- Stage ---------- */
#stage{
  position:relative;flex:1;min-height:0;overflow:hidden;
  background:#3a2a1e center/cover no-repeat;
}
#stack{
  position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
  width:min(200px,52vw);
}
.layer{position:absolute;left:50%;transform:translateX(-50%);width:100%;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
  animation:drop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{0%{transform:translateX(-50%) translateY(-90px) scaleY(1.15)}70%{transform:translateX(-50%) translateY(0) scaleY(.82)}100%{transform:translateX(-50%) translateY(0) scaleY(1)}}
#preview{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:var(--painel);border:2px solid var(--tinta);border-radius:10px;
  padding:6px 14px;text-align:center;min-width:170px;z-index:3;
}
#preview .big{font-size:18px;font-weight:800}
#preview .big .c{color:#6fb8e8}
#preview .big .m{color:var(--ketchup)}
#preview .tot{font-size:11px;color:var(--mostarda)}
#stabwrap{position:absolute;right:10px;top:64px;width:20px;bottom:22%;display:flex;flex-direction:column-reverse;gap:3px;z-index:3}
.seg{flex:1;background:#1a0f09;border:2px solid var(--tinta);border-radius:4px}
.seg.on{background:var(--ok)}
.seg.warn{background:var(--mostarda)}
.seg.hot{background:var(--ketchup)}
#stablbl{position:absolute;right:6px;top:44px;font-size:8px;letter-spacing:1px;opacity:.8;z-index:3}
.float{
  position:absolute;font-weight:800;font-size:15px;z-index:6;pointer-events:none;
  text-shadow:2px 2px 0 var(--tinta);animation:fl 1s ease-out forwards;
}
@keyframes fl{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-46px)}}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(5px,3px)}75%{transform:translate(-3px,1px)}}

/* ---------- Hand ---------- */
#handwrap{background:var(--painel);border-top:3px solid var(--tinta);padding:8px 8px 4px;z-index:5}
#hand{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
#hand::-webkit-scrollbar{display:none}
.card{
  flex:0 0 auto;width:86px;background:#231409;border:2px solid #5a3d22;border-radius:9px;
  padding:6px 4px 5px;text-align:center;transition:transform .08s;position:relative;
}
.card:active{transform:scale(.93)}
.card img{width:70px;display:block;margin:2px auto}
.card .nm{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.card .pts{font-size:9px;color:#6fb8e8}
.card .st{position:absolute;top:3px;right:5px;font-size:8.5px;color:var(--mostarda)}
#actions{display:flex;gap:8px;padding:0 8px 10px;background:var(--painel);z-index:5}
.btn{
  flex:1;padding:12px 6px;border-radius:10px;font-weight:800;font-size:13px;letter-spacing:.5px;
  border:3px solid var(--tinta);color:var(--creme);
  box-shadow:0 4px 0 var(--tinta);transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.servir{background:linear-gradient(180deg,#e8543f,var(--ketchup))}
.btn.trocar{background:linear-gradient(180deg,#ffd257,var(--mostarda));color:var(--tinta)}
.btn.lixo{flex:0 0 74px;background:#5c666e}
.btn:disabled{opacity:.4;box-shadow:0 4px 0 var(--tinta);transform:none}

/* ---------- Overlays ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,8,4,.9);z-index:20;display:none;
  align-items:center;justify-content:center;padding:14px;
}
.overlay.show{display:flex}
.panel{
  background:var(--quadro);border:4px solid var(--tinta);border-radius:14px;
  padding:18px 16px;max-width:430px;width:100%;max-height:92vh;overflow-y:auto;
  box-shadow:0 8px 0 rgba(0,0,0,.4);
}
.panel h2{font-size:17px;letter-spacing:1px;margin-bottom:4px;color:var(--creme);text-transform:uppercase}
.panel .sub{font-size:11px;opacity:.85;margin-bottom:12px}
.offer{
  display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);
  border:2px solid var(--tinta);border-radius:10px;padding:9px;margin-bottom:8px;
}
.offer .tag{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;border:2px solid var(--tinta)}
.tag.r{background:#e9d9b0;color:var(--tinta)} .tag.s{background:#b9c4cc;color:var(--tinta)}
.offer .info{flex:1}
.offer .info b{font-size:12px;display:block}
.offer .info span{font-size:10px;opacity:.85;line-height:1.25;display:block}
.offer .buy{
  background:var(--mostarda);color:var(--tinta);font-weight:800;font-size:12px;
  border:3px solid var(--tinta);border-radius:8px;padding:8px 10px;box-shadow:0 3px 0 var(--tinta);
}
.offer .buy:disabled{opacity:.4}
.offer.sold{opacity:.45}
.panel .go{
  width:100%;margin-top:8px;padding:13px;border-radius:10px;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#8fd95c,var(--ok));color:var(--tinta);
  border:3px solid var(--tinta);box-shadow:0 4px 0 var(--tinta);
}
#resumo{font-size:12px;line-height:1.7;background:rgba(0,0,0,.25);border-radius:8px;padding:10px;margin-bottom:12px}
#resumo b{color:var(--mostarda)}
.howto{font-size:11.5px;line-height:1.6;margin-bottom:6px}
.howto b{color:var(--mostarda)}
#gameover .panel{background:#4a1f18}
#deadstats{font-size:13px;line-height:1.9;margin:10px 0}

/* ---------- Tutorial ---------- */
#tutbubble{
  position:fixed;z-index:30;display:none;max-width:290px;
  background:var(--creme);color:var(--tinta);border:3px solid var(--tinta);
  border-radius:12px;padding:12px 14px;font-size:12.5px;font-weight:700;line-height:1.5;
  box-shadow:0 5px 0 rgba(0,0,0,.45);
}
#tutbubble.show{display:block;animation:bpop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes bpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.tut-hi{outline:4px solid var(--mostarda) !important;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{outline-color:var(--mostarda)}50%{outline-color:#fff}}
.tut-dis{opacity:.3;pointer-events:none}

/* ---------- v0.2 ---------- */
#blivro{
  background:var(--creme);border:2px solid var(--tinta);border-radius:8px;
  font-size:16px;padding:5px 8px;box-shadow:0 3px 0 var(--tinta);
}
#blivro:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
.card.sel{border-color:var(--ketchup);background:#3a1410;transform:translateY(-8px)}
.card.sel::after{
  content:'✕';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:var(--ketchup);color:#fff;font-size:11px;font-weight:800;
  border:2px solid var(--tinta);border-radius:50%;width:20px;height:20px;line-height:17px;
}
.btn.trocar.mode{background:linear-gradient(180deg,#8fd95c,var(--ok));color:var(--tinta)}
#livro .panel{background:#3b2a1a}
.lsec{font-size:11px;font-weight:800;letter-spacing:1px;margin:12px 0 6px;color:var(--mostarda);text-transform:uppercase}
.lrow{
  display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.4;
  background:rgba(0,0,0,.25);border-radius:6px;padding:6px 9px;margin-bottom:5px;
}
.lrow b{font-size:11.5px}
.lrow .lb{color:#6fb8e8;white-space:nowrap;font-weight:800}
.lrow .lb.m{color:#ff8f83}
.lrow.off{opacity:.45}
.lrow .own{color:var(--ok);font-weight:800}
#offers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.scard{
  position:relative;aspect-ratio:210/294;background-size:100% 100%;background-repeat:no-repeat;
  cursor:pointer;transition:transform .08s;
}
.scard:active{transform:scale(.95)}
.scard .sart{position:absolute;top:24%;left:50%;transform:translateX(-50%);width:62%;image-rendering:pixelated}
.scard .sname{
  position:absolute;top:57%;left:10%;right:10%;text-align:center;
  font-size:10px;font-weight:800;color:var(--tinta);line-height:1.15;
}
.scard .sdesc{
  position:absolute;top:70%;left:11%;right:11%;text-align:center;
  font-size:8px;color:var(--tinta);line-height:1.3;
}
.scard .sprice{
  position:absolute;top:-7px;right:-5px;background:var(--mostarda);color:var(--tinta);
  font-size:12px;font-weight:800;border:2px solid var(--tinta);border-radius:8px;padding:3px 7px;
  box-shadow:0 2px 0 var(--tinta);
}
.scard.sold{opacity:.4;pointer-events:none}
.scard.sold .sprice{background:var(--ok)}
.scard.poor{filter:grayscale(.7);opacity:.6;pointer-events:none}
</style>
</head>
<body>

<div id="hud">
  <div class="box"><span class="lbl">Ronda</span><span class="val" id="hronda">1</span></div>
  <div class="box" id="alvowrap">
    <span class="lbl">Alvo: <span id="halvo">120</span> pts — tens <span id="hpts">0</span></span>
    <div id="alvobar"><div id="alvofill"></div></div>
  </div>
  <div class="box"><span class="lbl">Caixa</span><span class="val money" id="hmoney">4€</span></div>
  <div class="box"><span class="lbl">Serviços</span><span class="val" id="hserves">4</span></div>
  <button id="blivro" title="Livro de receitas">📖</button>
</div>
<div id="bossband"></div>
<div id="crew"></div>

<div id="stage">
  <div id="preview">
    <div class="big"><span class="c" id="pchips">0</span> × <span class="m" id="pmult">1</span></div>
    <div class="tot">= <span id="ptot">0</span> pts se servires já</div>
  </div>
  <span id="stablbl">EQUILÍBRIO</span>
  <div id="stabwrap"></div>
  <div id="stack"></div>
</div>

<div id="handwrap"><div id="hand"></div></div>
<div id="actions">
  <button class="btn lixo" id="blixo">LIXO</button>
  <button class="btn trocar" id="btrocar">TROCAR (3)</button>
  <button class="btn servir" id="bservir">SERVIR 🍔</button>
</div>

<div class="overlay show" id="intro">
  <div class="panel" style="text-align:center">
    <h2>Pilha &amp; Lucro</h2>
    <div class="sub">Monta burgers. Faz pontos. Bate o alvo.</div>
    <button class="go" onclick="iniciarTutorial()">▶ APRENDER A JOGAR (30s)</button>
    <button class="go" style="background:#5c666e;color:var(--creme);margin-top:6px" onclick="fecharIntro()">JÁ SEI JOGAR</button>
  </div>
</div>

<div id="tutbubble">
  <div id="tuttxt"></div>
  <button id="tutok" class="go" style="margin-top:8px;padding:8px;display:none">OK →</button>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <h2>✅ Ronda ganha!</h2>
    <div id="resumo"></div>
    <div id="offers"></div>
    <button class="go" id="bcontinuar">PRÓXIMA RONDA →</button>
  </div>
</div>

<div class="overlay" id="gameover">
  <div class="panel">
    <h2>💀 Balcão fechado</h2>
    <div id="deadstats"></div>
    <button class="go" onclick="location.reload()">TENTAR OUTRA RUN</button>
  </div>
</div>

<div class="overlay" id="livro">
  <div class="panel">
    <h2>📖 Livro do Balcão</h2>
    <div class="sub">Tudo o que pontua — planeia a tua build.</div>
    <div id="livrobody"></div>
    <button class="go" onclick="document.getElementById('livro').classList.remove('show')">FECHAR</button>
  </div>
</div>

  {e:'👯', n:'Dose Dupla', d:'dois iguais seguidos', b:'+6 fichas'},

  {n:'🥦 CRÍTICO VEGETARIANO: proteínas dão 0 fichas', f:s=>ING[s].cat==='proteina'},

  {n:'🧊 SEM FRESCOS HOJE: frescos dão 0 fichas', f:s=>ING[s].cat==='fresco'},
];

/* ============ ESTADO ============ */
const G = {
  ronda:1, pts:0, money:4,
  servesBase:4, trocasBase:3, serves:4, trocas:3,
  stabMaxBase:8,
  stack:[], hand:[],
  receitas:[RECEITAS[0]], staff:[],
  boss:null, totalBurgers:0, melhorBurger:0,
};
const alvo = r => Math.round(100*Math.pow(r,1.55)/10)*10 + 20;
const stabMax = () => G.stabMaxBase + (temStaff('balcao')?3:0);
const temStaff = id => G.staff.some(s=>s.id===id);
const stackCap = () => (G.boss && G.boss.cap) ? G.boss.cap : 99;

/* ============ AUDIO ============ */
let AC=null;
function beep(f,d=.07,type='square',v=.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

/* ============ RENDER ============ */
const $ = id => document.getElementById(id);
document.getElementById('stage').style.backgroundImage = `url(${SPR.fundo})`;

function renderHUD(){
  $('hronda').textContent = G.ronda;
  $('halvo').textContent = alvo(G.ronda);

  }

  const bb = $('bossband');
  if(G.boss){ bb.style.display='block'; bb.textContent = G.boss.n; } else bb.style.display='none';
}
function renderCrew(){
  const c = $('crew'); c.innerHTML='';
  G.staff.forEach(s=>{ c.innerHTML += `<span class="chip staff">👤 ${s.n}<span class="mini">${s.d}</span></span>`; });

  G.receitas.forEach(r=>{ c.innerHTML += `<span class="chip receita">📖 ${r.n}<span class="mini">${r.d}</span></span>`; });
  for(let i=G.receitas.length;i<3;i++) c.innerHTML += `<span class="chip vazio">📖 slot receita</span>`;
}
function renderStab(){
  const w = $('stabwrap'); w.innerHTML='';
  const max = stabMax(), used = pesoAtual();
  for(let i=0;i<max;i++){
    const s = document.createElement('div'); s.className='seg';

    w.appendChild(s);
  }
}
const pesoAtual = () => G.stack.reduce((a,s)=>a+ING[s].peso,0);

function sprOf(key, idx){
  if(key==='queijo'){
    const abaixo = idx>0 ? G.stack[idx-1] : null;
    if((abaixo && ING[abaixo].cat==='proteina') || temStaff('estufa')) return SPR['queijo_derretendo'];
    return SPR['queijo_frio'];
  }
  return SPR[ING[key].spr||key];
}
function renderStack(){
  const st = $('stack'); st.innerHTML='';
  let y = 0;
  const base = document.createElement('img');
  base.src = SPR.pao_base; base.className='layer'; base.style.bottom='0px'; base.style.zIndex=1;
  st.appendChild(base);
  y = 26;
  G.stack.forEach((k,i)=>{
    const im = document.createElement('img');
    im.src = sprOf(k,i); im.className='layer';
    im.style.bottom = y+'px'; im.style.zIndex = i+2;
    st.appendChild(im);
    const hpx = {carne:20,frango:18,bacon:16,ovo:16,queijo:10,alface:16,tomate:14,cebola:11,picles:11,ketchup:9,maionese:9,molho_especial:10}[k]||14;
    y += hpx;
  });
  st.style.height = (y+90)+'px';
  renderStab();
  renderPreview();
}
function renderHand(){
  const h = $('hand'); h.innerHTML='';
  let hiDone = false;
  G.hand.forEach((k,i)=>{
    const c = document.createElement('div'); c.className='card';
    if(swapMode && swapSel.has(i)) c.classList.add('sel');
    if(TUT.active && TUT.expect){
      if(k===TUT.expect && !hiDone){ c.classList.add('tut-hi'); hiDone=true; }
      else c.classList.add('tut-dis');
    } else if(TUT.active && TUT.step>=3 && TUT.step<5){
      c.classList.add('tut-dis');
    }
    c.innerHTML = `<span class="st">⚖${ING[k].peso}</span><img src="${SPR[ING[k].spr||k]}"><div class="nm">${ING[k].n}</div><div class="pts">+${ING[k].chips} fichas</div>`;
    c.onclick = ()=>place(i);
    h.appendChild(c);
  });
}

/* ============ SCORE ============ */
function calc(stack){
  let chips=0, mult=1; const notas=[];
  stack.forEach((k,i)=>{
    let c = ING[k].chips;
    if(G.boss && G.boss.f && G.boss.f(k)) c = 0;
    if(k==='bacon' && temStaff('chefbacon')){ c+=12; }
    if(ING[k].cat==='fresco' && temStaff('horta')){ c+=5; }
    if(ING[k].cat==='molho' && temStaff('msecreto')){ c+=6; }
    chips += c;
    if(k==='queijo'){
      const sobreProteina = i>0 && ING[stack[i-1]].cat==='proteina';
      if(sobreProteina){ mult+=2; notas.push(['🧀 Derretido','+2 mult',i]); }
      else if(temStaff('estufa')){ mult+=1; notas.push(['🧀 Estufa','+1 mult',i]); }
    }
    if(i===0 && ING[k].cat==='molho'){ chips+=8; notas.push(['🥖 Base Selada','+8',i]); }
    if(i>0){
      const ant = stack[i-1];
      if((k==='tomate'&&ant==='alface')||(k==='alface'&&ant==='tomate')){ chips+=10; notas.push(['🥗 Fresquinho','+10',i]); }
      if((k==='bacon'&&ant==='queijo')||(k==='queijo'&&ant==='bacon')){ chips+=12; notas.push(['🥓 Crocante','+12',i]); }
      if((k==='ovo'&&ant==='bacon')||(k==='bacon'&&ant==='ovo')){ mult+=1; notas.push(['🍳 Peq.-Almoço','+1 mult',i]); }
      if(k===ant){ chips+=6; notas.push(['👯 Dose Dupla','+6',i]); }
    }
  });
  G.receitas.forEach(r=>{
    let hit=false;
    if(r.seq){
      for(let i=0;i+r.seq.length<=stack.length;i++){
        if(r.seq.every((s,j)=>stack[i+j]===s)){ hit=true; break; }
      }
    } else if(r.count){ hit = stack.filter(s=>s===r.count[0]).length>=r.count[1]; }
    else if(r.countCat){ hit = stack.filter(s=>ING[s].cat===r.countCat[0]).length>=r.countCat[1]; }
    if(hit){
      if(r.chips){ chips+=r.chips; notas.push(['📖 '+r.n,'+'+r.chips,-1]); }
      if(r.mult){ mult+=r.mult; notas.push(['📖 '+r.n,'+'+r.mult+' mult',-1]); }
    }
  });
  return {chips, mult, total:Math.round(chips*mult), notas};
}
function renderPreview(){
  const s = calc(G.stack);
  $('pchips').textContent = s.chips;
  $('pmult').textContent = s.mult;
  $('ptot').textContent = s.total;
}

/* ============ AÇÕES ============ */
function draw(){ return POOL[Math.floor(Math.random()*POOL.length)]; }
function refill(){ while(G.hand.length<7) G.hand.push(draw()); renderHand(); }

let busy=false;
let swapMode=false;
const swapSel = new Set();

function place(i){
  if(busy) return;
  if(swapMode){ toggleSel(i); return; }
  const k = G.hand[i];
  if(TUT.active && TUT.expect && k!==TUT.expect) return;
  if(G.stack.length >= stackCap()){ toast('⏱️ O cliente não aceita mais camadas!'); return; }
  if(pesoAtual()+ING[k].peso > stabMax()){ return tomba(k,i); }
  G.hand.splice(i,1); G.stack.push(k);
  beep(300+G.stack.length*45, .06);
  if(TUT.active) hideBubble();
  refill(); renderStack();
  tutAdvanceAfterPlace(k);
}
function toggleSel(i){
  if(swapSel.has(i)) swapSel.delete(i); else swapSel.add(i);
  beep(swapSel.has(i)?420:320,.04);
  renderHand(); updateTrocarBtn();
}
function updateTrocarBtn(){
  const b = $('btrocar');
  if(swapMode){
    b.classList.add('mode');
    b.textContent = swapSel.size>0 ? `✓ TROCAR ${swapSel.size}` : 'ESCOLHE ✕';
    $('blixo').textContent = 'VOLTAR';
    $('blixo').disabled = false;
  } else {
    b.classList.remove('mode');
    b.textContent = `TROCAR (${G.trocas})`;
    $('blixo').textContent = 'LIXO';
  }
}
function tomba(){
  busy=true;
  beep(160,.3,'sawtooth',.18); setTimeout(()=>beep(90,.4,'sawtooth',.18),120);
  document.body.classList.add('shake');
  toast('💥 TOMBOU! Pilha perdida (−1 serviço)');
  setTimeout(()=>{
    document.body.classList.remove('shake');
    G.stack=[]; G.serves--;
    renderStack(); renderHUD(); busy=false;
    checarFim();
  }, 700);
}
function trocar(){
  if(busy||TUT.active) return;
  if(!swapMode){
    if(G.trocas<=0) return;
    swapMode = true; swapSel.clear();
    toast('Toca nos ingredientes que queres trocar');
    renderHand(); updateTrocarBtn();
    return;
  }
  if(swapSel.size===0){ sairSwap(); return; }
  G.trocas--;
  [...swapSel].sort((a,b)=>b-a).forEach(i=>G.hand.splice(i,1));
  sairSwap();
  refill(); renderHUD();
  beep(500,.05); beep(650,.05);
}
function sairSwap(){
  swapMode=false; swapSel.clear();
  renderHand(); updateTrocarBtn(); renderHUD();
}
function lixo(){
  if(busy||TUT.active) return;
  if(swapMode){ sairSwap(); return; }
  if(G.trocas<=0||G.stack.length===0) return;
  G.trocas--; G.stack=[]; renderStack(); renderHUD(); beep(220,.15,'triangle');
  toast('🗑️ Pilha para o lixo (−1 troca)');
}
function servir(){
  if(busy||G.serves<=0) return;
  if(swapMode){ sairSwap(); return; }
  if(TUT.active && TUT.step!==4) return;
  if(G.stack.length===0){ toast('O burger está vazio!'); return; }
  if(TUT.active) hideBubble();
  busy=true;
  const s = calc(G.stack);
  const st = $('stack');
  const topo = document.createElement('img');
  topo.src = SPR.pao_topo; topo.className='layer';
  topo.style.bottom = st.style.height.replace('px','')-84+'px'; topo.style.zIndex=99;
  st.appendChild(topo);
  beep(520,.08);
  let t=350;
  s.notas.forEach(n=>{
    setTimeout(()=>{ floatTxt(n[0]+' '+n[1], n[1].includes('mult')?'#D8352A':'#6fb8e8'); beep(700+Math.random()*300,.06); }, t);
    t+=330;
  });
  setTimeout(()=>{
    floatTxt('+'+s.total+' pts','#F2B32A',22);
    beep(880,.1);beep(1100,.12);
    G.pts += s.total; G.totalBurgers++;
    G.melhorBurger = Math.max(G.melhorBurger, s.total);
    G.serves--; G.stack=[];
    renderStack(); renderHUD();
    busy=false;
    if(TUT.active && TUT.step===4){ tutStep(5); return; }
    checarFim();
  }, t+420);
}
function floatTxt(txt,color,size=15){
  const f = document.createElement('div');
  f.className='float'; f.textContent=txt;
  f.style.color=color; f.style.fontSize=size+'px';
  f.style.left = (32+Math.random()*36)+'%';
  f.style.top = (26+Math.random()*22)+'%';
  $('stage').appendChild(f);
  setTimeout(()=>f.remove(),1000);
}
let toastEl=null;
function toast(t){
  if(toastEl) toastEl.remove();
  toastEl = document.createElement('div');
  toastEl.className='float'; toastEl.textContent=t;
  toastEl.style.cssText+='left:50%;top:42%;transform:translateX(-50%);color:#fff;font-size:13px;animation-duration:1.6s';
  $('stage').appendChild(toastEl);
}

/* ============ RONDAS ============ */
function checarFim(){
  if(G.pts >= alvo(G.ronda)) return abrirLoja();
  if(G.serves<=0) return gameOver();
  renderHUD();
}
function abrirLoja(){
  const bonus = 4 + G.serves + G.trocas;
  G.money += bonus;
  $('resumo').innerHTML = `Alvo <b>${alvo(G.ronda)}</b> batido com <b>${G.pts} pts</b>.<br>Ganhas <b>${bonus}€</b> (4 base + ${G.serves} serviços + ${G.trocas} trocas não usados).<br>Caixa: <b>${G.money}€</b>`;
  const off = $('offers'); off.innerHTML='';
  const poolR = RECEITAS.filter(r=>!G.receitas.some(x=>x.id===r.id) && r.preco>0);
  const poolS = STAFF.filter(s=>!G.staff.some(x=>x.id===s.id));
  shuffle(poolR); shuffle(poolS);
  const offers = [...poolS.slice(0,2).map(o=>({o,t:'s'})), ...poolR.slice(0,2).map(o=>({o,t:'r'}))];
  const refreshAfford = ()=>{
    off.querySelectorAll('.scard').forEach(c=>{
      if(!c.classList.contains('sold')){
        c.classList.toggle('poor', parseInt(c.dataset.preco) > G.money);
      }
    });
  };
  offers.forEach(({o,t})=>{
    const div = document.createElement('div');
    div.className = 'scard';
    div.dataset.preco = o.preco;
    div.style.backgroundImage = `url(${t==='s'?SPR.card_staff:SPR.card_receita})`;
    div.innerHTML = `
      <span class="sprice">${o.preco}€</span>
      <img class="sart" src="${SPR[o.icon]}">
      <div class="sname">${o.n}</div>
      <div class="sdesc">${o.d}</div>`;
    div.onclick = ()=>{
      if(G.money<o.preco) return;
      if(t==='s' ? G.staff.length>=3 : G.receitas.length>=3){ toast('Slots cheios!'); return; }
      G.money-=o.preco;
      (t==='s'?G.staff:G.receitas).push(o);
      div.classList.add('sold');
      div.querySelector('.sprice').textContent='✓';
      beep(700,.06);beep(950,.08);
      renderCrew(); renderHUD();
      $('resumo').innerHTML += `<br>→ <b>${o.n}</b> contratado!`;
      refreshAfford();
    };
    off.appendChild(div);
  });
  refreshAfford();
  $('shop').classList.add('show');
}
function proximaRonda(){
  $('shop').classList.remove('show');
  swapMode=false; swapSel.clear();
  G.ronda++; G.pts=0;
  G.serves = G.servesBase + (temStaff('turno')?1:0);
  G.trocas = G.trocasBase + (temStaff('maos')?1:0);
  G.boss = (G.ronda%3===0) ? BOSSES[(G.ronda/3-1)%BOSSES.length] : null;
  G.stack=[]; G.hand=[]; refill();
  renderStack(); renderHUD(); renderCrew();
  if(G.boss) toast(G.boss.n);
}
function gameOver(){
  $('deadstats').innerHTML = `Aguentaste <b>${G.ronda}</b> ronda(s).<br>Serviste <b>${G.totalBurgers}</b> burgers.<br>Melhor burger: <b>${G.melhorBurger} pts</b>.`;
  $('gameover').classList.add('show');
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function fecharIntro(){ $('intro').classList.remove('show'); beep(600,.08); }

/* ============ TUTORIAL ============ */
const TUT = {active:false, step:0, expect:null};
function bubble(txt, pos, okFn){
  const b = $('tutbubble');
  $('tuttxt').innerHTML = txt;
  const ok = $('tutok');
  if(okFn){ ok.style.display='block'; ok.onclick = ()=>{ b.classList.remove('show'); okFn(); }; }
  else ok.style.display='none';
  Object.assign(b.style, {top:'',bottom:'',left:'',right:'',transform:''}, pos);
  b.classList.add('show');
}
function hideBubble(){ $('tutbubble').classList.remove('show'); }
function iniciarTutorial(){
  fecharIntro();
  TUT.active = true;
  G.hand = ['carne','queijo', draw(), draw(), draw(), draw(), draw()];
  renderHand();
  tutStep(1);
}
function tutStep(n){
  TUT.step = n;
  if(n===1){
    TUT.expect = 'carne';
    bubble('🥩 Toca na <b>CARNE</b> aqui em baixo para a empilhar no pão.', {bottom:'160px', left:'50%', transform:'translateX(-50%)'});
  }
  if(n===2){
    TUT.expect = 'queijo';
    bubble('🧀 Agora o <b>QUEIJO</b>. Repara: em cima da carne, ele <b>derrete</b> → bónus!', {bottom:'160px', left:'50%', transform:'translateX(-50%)'});
  }
  if(n===3){
    TUT.expect = null;
    $('preview').classList.add('tut-hi');
    bubble('📊 Os teus pontos: <b>FICHAS × MULT</b>.<br>Cada ingrediente dá fichas. Combinações vizinhas (como o 🧀 Derretido) sobem o <b>MULT</b> — é aí que os pontos explodem.', {top:'120px', left:'50%', transform:'translateX(-50%)'}, ()=>{
      $('preview').classList.remove('tut-hi');
      tutStep(4);
    });
  }
  if(n===4){
    $('bservir').classList.add('tut-hi');
    bubble('🍔 Toca em <b>SERVIR</b> para fechar o burger e pontuar!', {bottom:'80px', right:'12px'});
  }
  if(n===5){
    $('bservir').classList.remove('tut-hi');
    bubble('🎯 O objetivo: enche a <b>barra vermelha (ALVO)</b> lá em cima antes de gastares os <b>4 SERVIÇOS</b>.<br><br>⚖️ Atenção ao <b>EQUILÍBRIO</b> (barra à direita): molhos pesam 2 — se passares do limite, a pilha <b>tomba</b>!<br><br>🔄 <b>TROCAR</b> renova a bancada. Entre rondas, compras <b>staff e receitas</b>. Boa run!', {top:'50%', left:'50%', transform:'translate(-50%,-50%)'}, ()=>{
      TUT.active = false;
      renderHand();
    });
  }
  renderHand();
}
function tutAdvanceAfterPlace(k){
  if(!TUT.active) return;
  if(TUT.step===1 && k==='carne') tutStep(2);
  else if(TUT.step===2 && k==='queijo') tutStep(3);
}

/* ============ LIVRO ============ */
function abrirLivro(){
  let h = '<div class="lsec">🔥 Adjacências (sempre ativas)</div>';
  ADJ.forEach(a=>{
    h += `<div class="lrow"><span>${a.e} <b>${a.n}</b> — ${a.d}</span><span class="lb ${a.m?'m':''}">${a.b}</span></div>`;
  });
  h += '<div class="lsec">📖 Receitas (compram-se na loja · máx 3)</div>';
  RECEITAS.forEach(r=>{
    const own = G.receitas.some(x=>x.id===r.id);
    h += `<div class="lrow ${own?'':'off'}"><span><b>${r.n}</b> — ${r.d}</span><span class="${own?'own':'lb'}">${own?'✓ TENS':r.preco+'€'}</span></div>`;
  });
  h += '<div class="lsec">👤 Staff (contrata na loja · máx 3)</div>';
  STAFF.forEach(s=>{
    const own = G.staff.some(x=>x.id===s.id);
    h += `<div class="lrow ${own?'':'off'}"><span><b>${s.n}</b> — ${s.d}</span><span class="${own?'own':'lb'}">${own?'✓ TENS':s.preco+'€'}</span></div>`;
  });
  $('livrobody').innerHTML = h;
  $('livro').classList.add('show');
}

$('bservir').onclick = servir;
$('btrocar').onclick = trocar;
$('blixo').onclick = lixo;
$('bcontinuar').onclick = proximaRonda;
$('blivro').onclick = abrirLivro;

refill(); renderStack(); renderHUD(); renderCrew();
</script>
</body>
